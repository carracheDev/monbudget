name: Build APK (cloud)

# Build l'APK MonBudget sur les serveurs GitHub puis le publie dans les releases
# de CE dépôt (public) → lien de téléchargement rapide.
# Déclenchement : à chaque push sur main, ou manuellement (onglet Actions).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag de la release (laisser vide = 'latest')"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Flutter 3.44.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: Adapter gradle.properties pour le cloud
        run: |
          sed -i 's/org.gradle.offline=true/org.gradle.offline=false/' android/gradle.properties 2>/dev/null || true

      - name: Restaurer la signature release (déchiffrement)
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          if [ -n "$SIGNING_PASSPHRASE" ] && [ -f android/signing.tar.enc ]; then
            mkdir -p /tmp/sign
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:"$SIGNING_PASSPHRASE" -in android/signing.tar.enc | tar -xf - -C /tmp/sign; then
              echo "❌ Déchiffrement impossible → vérifie le secret SIGNING_PASSPHRASE."
              exit 1
            fi
            mv /tmp/sign/monbudget.jks android/app/monbudget.jks
            mv /tmp/sign/key.properties android/key.properties
            echo "✅ Signature release configurée (clé déchiffrée)."
          else
            echo "ℹ️ Pas de passphrase → signature debug (réinstallation testeurs nécessaire une fois)."
          fi

      - name: Dépendances Flutter
        run: flutter pub get

      - name: Build APK (séparé par ABI = plus léger)
        run: flutter build apk --release --split-per-abi

      - name: Renommer l'APK arm64
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk MonBudget.apk

      - name: Taille de l'APK
        run: ls -lh MonBudget.apk

      - name: Publier sur les releases (repo public)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || 'latest' }}
          name: MonBudget ${{ inputs.version || 'latest' }}
          files: MonBudget.apk
          fail_on_unmatched_files: true
